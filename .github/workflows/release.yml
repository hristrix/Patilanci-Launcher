name: Build and publish Windows installer

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: windows-installer-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-launcher

      - name: Validate release and configure public download service
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_DOWNLOAD_SERVICE_URL: ${{ vars.PUBLIC_DOWNLOAD_SERVICE_URL }}
        run: node packaging/prepare-release.cjs

      - name: Install dependencies
        run: npm ci

      - name: Validate launcher
        run: npm run validate

      - name: Build production Windows installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Verify installer and updater metadata
        run: npm run check:installer

      - name: Save production release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-production-${{ steps.release.outputs.version }}
          path: |
            release/production/installer/*.exe
            release/production/installer/latest.yml
            release/production/installer/*.blockmap
          if-no-files-found: error
          retention-days: 30

      # Publish only after every asset has uploaded to the draft successfully.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          EXISTING_DRAFT: ${{ steps.release.outputs.existing_draft }}
        run: |
          set -euo pipefail
          output=release/production/installer
          installer="$output/Patilanci-Launcher-Setup-$VERSION-x64.exe"
          test -f "$installer"
          test -f "$output/latest.yml"
          if [ "$EXISTING_DRAFT" != "true" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Patilanci Launcher $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi
          assets=("$installer" "$output/latest.yml")
          for blockmap in "$output"/*.blockmap; do
            if [ -f "$blockmap" ]; then assets+=("$blockmap"); fi
          done
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --draft=false --latest

      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ github.run_id }}
          path: |
            artifacts/
            release/**/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 7
